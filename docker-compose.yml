# 本地开发：PostgreSQL + Redis。生产部署见 docs/17。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms
      POSTGRES_DB: pms_control
    ports: ["5432:5432"]
    volumes: ["pms_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pms_pg:
