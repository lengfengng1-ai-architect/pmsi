version: "v0.1"
platform:
  name: "项目管理系统（PMS）"
  description: "SaaS 多租户、一租户一库的项目经营系统；FastAPI 异步 + Celery + React。MVP 固化顶级 PM 的拆控推追回。"

capabilities:
  # ===== MVP (P0) — in_scope =====
  in_scope:
    - id: "tenancy-auth"
      name: "租户/认证/SSO"
      description: "一租户一库引擎路由(contextvars)、JWT/OIDC/SAML SSO、SCIM、RBAC×范围依赖"
      constraints: "禁跨租户会话复用；每请求重置 contextvars"
    - id: "projects-milestones"
      name: "项目/章程/里程碑"
      description: "项目状态机(图10)、go/no-go、里程碑一等对象"
      constraints: "无基线不得进入 executing(AC-PRJ-02)"
    - id: "wbs-tasks"
      name: "WBS/任务/交付物"
      description: "WBS 强制带交付物/责任人/截止/验收；任务状态机(图5)；闭环确认"
      constraints: "确认人≠提交人(AC-DM-07b/TASK-02)；交付物过 AC-X01a；基线后 WBS diff 自动生成变更(AC-WBS-01)"
    - id: "decisions"
      name: "决策管理"
      description: "决策卡/选项/状态机(图4)/自动升级/决策债/留痕"
      constraints: "≥2 互斥选项(AC-DM-01a)；唯一决策人；截止≤里程碑(AC-DM-12b)；回退不重置计息时钟；落地 N:1 绑定"
    - id: "risks"
      name: "风险与问题"
      description: "四策略(规避/转移/减轻/接受)、风险状态机(图6,按策略分叉)、转问题双计 S4"
      constraints: "高危关闭须发起人/PMO(AC-RISK-03)；等级须证据(AC-X02)"
    - id: "changes-baseline"
      name: "变更/基线"
      description: "变更状态机(图7)、基线快照冻结 PV"
      constraints: "CPI/SPI 对原始基线累计，重建只喂前瞻 EAC(AC-BASE-02)；重建 N≥2 封顶"
    - id: "health"
      name: "项目健康分(轻)"
      description: "MVP 4 信号红黄绿 + 否决(按阶段启用) + 灰判定 + 趋势/迟滞"
      constraints: "标量须证据化(AC-X02)；转好经恢复中·黄、周期=日、1h 去抖(AC-HS-07/07b)；缺数据不得绿(AC-HS-04a)"
    - id: "retro"
      name: "结构化复盘"
      description: "复盘状态机(图8)、结构化资产、PMO 抽审入库"
      constraints: "产出≥1 结构化资产 + PMO 抽审方可结项(AC-RET-02)；评审有 SLA"
    - id: "automation"
      name: "自动化(核心规则)"
      description: "硬编码 Celery 任务：决策升级/T2 countdown 代决/逾期提醒/风险报警/健康阈值动作"
      constraints: "升级全自动不靠人工催办；计息时钟粘滞(AC-DM-13a)"
    - id: "notifications-mvp"
      name: "通知(服务)"
      description: "站内+邮件、聚合/频次封顶/DND/优先级；通知中心为系统服务(MVP)"
      constraints: "IM 双向卡片=P1"
    - id: "evidence"
      name: "证据对象(横切)"
      description: "数值证据化：标量赋值(含首次)挂证据+独立复核"
      constraints: "证据标来源 human/system/ai；AI 生成内容不单独作证(AC-X02)"
    - id: "audit"
      name: "审计(append-only)"
      description: "audit_event 同事务写入，revoke UPDATE/DELETE + 触发器"
      constraints: "不可物理删，仅追加更正"
    - id: "workcalendar"
      name: "工作日历"
      description: "默认组织工作日历(节假日)，SLA 按工作日算"
      constraints: "MVP 含默认组织日历；项目/个人日历=P1"

  # ===== P1/P2/P3 — out_scope (MVP 不做) =====
  out_scope:
    - id: "portfolio-combo"
      name: "组合层(战略评分/容量/stage-gate)"
      reason: "P2，多项目才需要"
    - id: "program"
      name: "Program 项目集层"
      reason: "P2 扩展(届时升四层架构)"
    - id: "full-evm"
      name: "完整 EVM(8 维+CPI/EAC/VAC/TCPI)"
      reason: "P1，需成本/工时数据"
    - id: "decision-debt-viz"
      name: "决策债可视化"
      reason: "P1 增强"
    - id: "cross-project-kb"
      name: "经验库跨项目复用"
      reason: "P1(MVP 仅单项目资产)"
    - id: "full-ccb"
      name: "完整 CCB 变更治理"
      reason: "P1(MVP 变更轻版，发起人确认)"
    - id: "custom-rule-engine"
      name: "可配置自动化规则引擎"
      reason: "P1(MVP 硬编码规则)"
    - id: "integrations-im-doc-code-finance"
      name: "IM/文档/代码/财务集成"
      reason: "P1/P2(集成而非自建)；IM 双向=P1"
    - id: "search-opensearch"
      name: "全局搜索(OpenSearch)"
      reason: "P1(MVP 依赖角色驾驶舱+下钻，不做全局搜索)"
    - id: "mobile-native"
      name: "原生 App"
      reason: "P3(MVP 仅 PWA 关键路径)"
    - id: "ai-copilot"
      name: "AI 副驾(LangGraph 编排)"
      reason: "P3；届时启用 development-workflow-guide 的 agent 规范(§7.7/附录C)"
    - id: "premortem-playbook"
      name: "pre-mortem 闸/风险剧本"
      reason: "P3 高阶控"
    - id: "cross-org-benchmark"
      name: "跨组织对标"
      reason: "P3"

data_boundaries:
  can_use:
    - "设计文档 docs/01–18（业务规则/AC/数据模型/API）"
    - "OpenAPI spec（docs/api/）"
    - "真实 PostgreSQL（经 Alembic 迁移建表）"
    - "seed/fixture 数据（真实命名、跨表 ID 一致）"
  cannot_use:
    - "真实租户/用户隐私数据（脱敏/合成）"
    - "生产库直连（仅隔离测试库）"
    - "第三方付费/未授权外部 API"

llm_boundaries:
  can_generate:
    - "按 spec 生成 CRUD/路由/Pydantic 模型/Alembic 迁移骨架/状态机迁移/守卫/测试/文档"
    - "按 codegraph 已有符号续写（命名一致）"
    - "基于 spec/数据的推理实现"
  cannot_generate:
    - "业务规则与字段语义（docs/05/06 人定）"
    - "架构决策/安全阈值/合规规则"
    - "真实租户/用户数据、编造 seed 命名与数值"
    - "LLM 自己的运行时 prompt（P3 才涉及，且须人工背书）"
